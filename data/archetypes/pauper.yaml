  # Stinkweed Imp appears in eleven Pauper decks and every one is this Lotleth Giant
  # dredge shell, so it carries the definition alone. Town Greeter would be the third
  # card but ten of the eleven run it: gating on it drops the mono-red Faithless Looting
  # build, which is the same deck.
  - name: Dredge
    signatureCards:
