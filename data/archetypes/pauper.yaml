  # Artifact creature swarm with Search Party Captain, Martyr's Soul and Salt Road
  # Packbeast, from late August 2026. Most lists splash green for Winding Way; the
  # mono-white lists without it are the same deck and keep this name. Battle Screech at
  # zero leaves the hybrid lists to Mono-White Aggro (Battle Screech and Kor Skyfisher).
  - name: Selesnya Rally
    signatureCards:
      - name: "Search Party Captain"
        minCopies: 3
      - name: "Martyr's Soul"
        minCopies: 3
      - name: "Salt Road Packbeast"
        minCopies: 3
