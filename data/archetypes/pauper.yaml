  # Glint Hawk builds with Myr Enforcer and no Kor Skyfisher, which the rule above misses. It
  # shares the label with the rule above on purpose. Kor Skyfisher at zero keeps the two from
  # matching the same deck. Ancient Den is the white marker, Great Furnace at zero yields the
  # red builds to 4c Affinity, Springleaf Drum at zero yields the Drum builds to Esper Leonardo.
  - name: Esper Affinity
    signatureCards:
      - name: "Myr Enforcer"
        minCopies: 3
      - name: "Ancient Den"
        minCopies: 1
      - name: "Great Furnace"
        exactCopies: 0
      - name: "Kor Skyfisher"
        exactCopies: 0
      - name: "Springleaf Drum"
        exactCopies: 0
  # Esper Affinity with a red splash in the main (Great Furnace, Galvanic Blast). Vault of
  # Whispers keeps it apart from Jeskai Affinity, which Boros Synthesizer already labels.
  # Glint Hawk runs here but Kor Skyfisher does not, so the Glint Hawk Esper Affinity rule
  # never matches these decks.
  - name: 4c Affinity
    signatureCards:
