  # Second Green Tron build, from mid 2026. Bramble Wurm and Giant's Boulder replace
  # Maelstrom Colossus. It shares the label with the rule above on purpose. Maelstrom
  # Colossus at zero keeps the two from matching the same deck. Mysidian Elder and Ghostly
  # Flicker at zero yield the flicker builds to Grixis Flicker Tron and Ephemerate Tron.
  - name: Green Tron
    signatureCards:
      - name: "Urza's Tower"
        minCopies: 2
      - name: "Bramble Wurm"
        minCopies: 3
      - name: "Giant's Boulder"
        minCopies: 3
      - name: "Maelstrom Colossus"
        exactCopies: 0
      - name: "Mysidian Elder"
        exactCopies: 0
      - name: "Ghostly Flicker"
        exactCopies: 0
  # Golem Foundry is a flexible slot (0-4 across the corpus), so it stays out. Myr
  # Retriever is the stable half of the engine: all 92 historical Altar decks run 4.
  - name: Altar Tron
    signatureCards:
      - name: "Ashnod's Altar"
        minCopies: 2
      - name: "Myr Retriever"
        minCopies: 4
      - name: "Urza's Tower"
