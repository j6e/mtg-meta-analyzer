  # Draw-go Dimir with Thorn of the Black Rose and no faerie or Terror threats. Some lists
  # splash red, but only in the sideboard (Mountain, Hydroblast), so they keep this name.
  # Spellstutter Sprite, Tolarian Terror and Ephemerate at zero keep it apart from Dimir
  # Faeries, the Terror decks and Esper Ephemerate, which share the Counterspell and
  # Lórien Revealed core.
  - name: Dimir Control
    signatureCards:
      - name: "Counterspell"
        minCopies: 4
      - name: "Lórien Revealed"
        minCopies: 4
      - name: "Thorn of the Black Rose"
        minCopies: 1
      - name: "Spellstutter Sprite"
        exactCopies: 0
      - name: "Tolarian Terror"
        exactCopies: 0
      - name: "Ephemerate"
        exactCopies: 0
  # Ephemerate and Archaeomancer value with Counterspell, in black and white. Skred and
  # Lightning Bolt at zero yield the red builds to Jeskai Ephemerate. Some lists play the
  # affinity lands with Dispatch, they are still this deck.
  - name: Esper Ephemerate
    signatureCards:
      - name: "Ephemerate"
        minCopies: 2
      - name: "Archaeomancer"
        minCopies: 2
      - name: "Counterspell"
        minCopies: 4
      - name: "Skred"
