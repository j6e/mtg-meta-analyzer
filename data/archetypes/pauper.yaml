  # Artifact aggro from mid 2026, split out of Esper Affinity. Springleaf Drum, Leonardo, Big
  # Brother and Novice Inspector with Myr Enforcer and Thoughtcast, and no Glint Hawk package.
  # Myr Enforcer keeps out the Selesnya Rally and Boros Bully lists that also play Drum,
  # Leonardo and Novice Inspector.
  - name: Esper Leonardo
    signatureCards:
      - name: "Springleaf Drum"
        minCopies: 3
      - name: "Leonardo, Big Brother"
        minCopies: 2
      - name: "Novice Inspector"
