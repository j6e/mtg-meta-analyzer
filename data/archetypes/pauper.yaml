  # Second Turbo Fog build, Golgari rather than Simic: same Moment's Peace plus Stream
  # of Thought plus Tangle core, but Crypt Rats and Weather the Storm in place of the
  # Growth Spiral card draw. It shares the label with the definition above on purpose.
  # Signature cards are AND-only, so one deck cannot express both builds, and the two
  # match zero decks in common, so no deck ever trips the exactly-one-match rule.
  # Darkness is the cleanest separator: it appears in eleven Pauper decks, all this build.
  - name: Turbo Fog
    signatureCards:
      - name: "Darkness"
        minCopies: 1
      - name: "Moment's Peace"
        minCopies: 3
      - name: "Stream of Thought"
        minCopies: 1
