name: Fetch Tournament

on:
  workflow_dispatch:
    inputs:
      tournament_url:
        description: 'Tournament URL or ID (e.g. https://melee.gg/Tournament/View/392401 or 392401)'
        required: true
        type: string
      create_pr:
        description: 'Create a pull request instead of pushing directly'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Fetch tournament data
        run: bun run scripts/fetch-tournament.ts "${{ inputs.tournament_url }}"

      - name: Check/rebuild card image index
        run: |
          if bun run scripts/check-card-image-index.ts; then
            echo "Card image index is current."
          else
            bun run scripts/build-card-image-index.ts
          fi

      - name: Check for changes
        id: changes
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            FILENAME=$(git diff --cached --name-only | grep -v -e 'index\.json' -e 'card-images\.json' -e 'card-images-status\.json' | head -1 || true)
            if [ -n "$FILENAME" ]; then
              ID=$(basename "$FILENAME" .json)
              MESSAGE="Add tournament data: $ID"
            else
              FILENAME="data/card-images.json"
              ID="card-image-index-refresh"
              MESSAGE="Refresh card image index"
            fi
            echo "tournament_id=$ID" >> "$GITHUB_OUTPUT"
            echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
            echo "commit_message=$MESSAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push directly
        if: steps.changes.outputs.changed == 'true' && inputs.create_pr == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${{ steps.changes.outputs.commit_message }}"
          git push

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true' && inputs.create_pr == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="fetch-tournament-${{ steps.changes.outputs.tournament_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "${{ steps.changes.outputs.commit_message }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "${{ steps.changes.outputs.commit_message }}" \
            --body "Fetched tournament data from melee.gg.

          **File:** \`${{ steps.changes.outputs.filename }}\`

          Triggered by workflow_dispatch." \
            --base master

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No new data — tournament file may already exist."
